# Settings for the MP226 water-demand pipeline.
# Change values here, never in the code.

data:
  train: data/raw/train.csv
  later: data/raw/later.csv
  holdout: data/raw/holdout_features.csv

columns:
  target: litres_per_day
  features:
    - flats_occupied
    - temp_c
    - garden_area_m2
    - tank_level_morning_pct
    - leak_complaints
    - supply_hours
    - supply_source
    - tower
  numeric:
    - flats_occupied
    - temp_c
    - garden_area_m2
    - tank_level_morning_pct
    - leak_complaints
    - supply_hours
  text:
    - supply_source
    - tower
  group: tower

clean:
  stuck_sensor:
    column: flats_occupied
    start_date: "2026-04-23"
    end_date: "2026-05-11"
    stuck_value: 184
  sentinel:
    column: tank_level_morning_pct
    value: 999
  unit_mixup:
    column: garden_area_m2
    group_col: tower
    group_value: "Tower A"
    factor: 10.764

train:
  val_split_fraction: 0.2
  models:
    ridge:
      alpha: 10.0
    random_forest:
      n_estimators: 100
      max_depth: 10
      random_state: 42
    gradient_boosting:
      n_estimators: 150
      learning_rate: 0.05
      max_depth: 4
      random_state: 42

seed: 42

drift:
  bins: 10
  binning: quantile  # "quantile" or "equal_width"

retrain:
  later_train_fraction: 0.7      # first 70% of later.csv (by date) goes into v2
  promotion_improvement: 0.15    # promote v2 only if its MAE is >= 15% lower
  later_weight_grid: [1, 5, 10, 20, 40]

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: mp226-water-demand
  registered_model_name: mp226-water-demand
