apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp226-api
  labels:
    app: mp226-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp226-api
  template:
    metadata:
      labels:
        app: mp226-api
    spec:
      containers:
      - name: api
        image: mp226-api:1.0
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
